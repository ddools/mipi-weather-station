# Copy to config.yaml and edit. Secrets go in .env, NOT here.

station:
  name: "Skerries Weather Station"
  latitude: 53.35        # decimal degrees
  longitude: -6.26
  elevation_m: 20        # metres above sea level (for sea-level pressure)

sampling:
  wind_sample_s: 5       # how often to sample wind for gust detection
  archive_interval_s: 60 # one archive record per minute

pins:                    # BCM numbering
  anemometer: 5
  rain_gauge: 6

calibration:
  anemometer_radius_cm: 9.0
  anemometer_adjustment: 2.36   # Oracle/Foundation kit factory calibration factor
  rain_bucket_mm: 0.2794        # mm per bucket tip
  # Air temperature source. The BMP085/HTU21D on the air board self-heat ~10 C
  # when the board sits near the Pi; the DS18B20 probe on its lead does not.
  #   auto     - use the DS18B20 if the 1-Wire bus has one, else the onboard chip
  #   ds18b20  - require the DS18B20 (collector won't start if it's absent)
  #   onboard  - always use the BMP085 temperature
  # DS18B20 needs 1-Wire enabled: `sudo raspi-config nonint do_onewire 0`.
  air_temp_source: auto
  # Wind vane: MCP342X ADC (addr 0x69) reading a fixed resistor-divider network
  # built into the Oracle kit board — these are the factory values, not per-unit.
  wind_vane:
    vin: 3.268
    vdivider_ohms: 75000
    directions:
      N: 33000
      NNE: 6570
      NE: 8200
      ENE: 891
      E: 1000
      ESE: 688
      SE: 2200
      SSE: 1410
      S: 3900
      SSW: 3140
      SW: 16000
      WSW: 14120
      W: 120000
      WNW: 42120
      NW: 64900
      NNW: 21880

sensors:
  # TGS2600 air-quality sensor on the snap-off board (MCP342X ADC at 0x6A).
  # Output is an uncalibrated 0-100 "contaminants" index on the Foundation kit's
  # own scale: higher = more reducing gases (CO, H2, VOCs — cooking, solvents,
  # smoke). Only meaningful against this station's own trend; it is NOT an AQI
  # or a µg/m³ figure and it is not uploaded to WU/Windy. Off unless the board
  # is fitted and you want it.
  air_quality:
    enabled: false
    warmup_s: 300   # suppress readings this long after start (heater stabilising)

storage:
  sqlite_path: "data/weather.sqlite3"
  retention_days: 0      # 0 = keep forever locally

uploaders:
  supabase:
    enabled: true
    table: "readings"
  wunderground:
    enabled: false
    station_id: ""       # e.g. IDUBLIN123
  windy:
    enabled: false
    station_id: ""       # e.g. C9fexco — password goes in .env, not here
