[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mipi-weatherstation"
version = "0.1.0"
description = "Collector for the Oracle Raspberry Pi Weather Station kit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dermot Dooley" }]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Hardware libs — install on the Pi only
pi = [
    "gpiozero>=2.0",
    "smbus2>=0.4",
    "RPi.GPIO; platform_machine=='armv7l' or platform_machine=='aarch64'",
]
dev = [
    "pytest>=8.0",
    # Pinned exact: ruff's formatter output shifts between releases, so CI and
    # local must agree on a version or `ruff format --check` flip-flops.
    "ruff==0.16.4",
]

[project.scripts]
weatherstation = "weatherstation.main:main"
# Prints every thermometer on the kit side by side — the first thing to run
# when the published temperature disagrees with the forecast.
weatherstation-doctor = "weatherstation.diagnose:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't silently change what CI enforces
# (newer ruff ships a broader default set). Everything here passes clean today.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
